{% extends "base.html" %}
{% block title %}حذف التصنيف | متجر الجوالات{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body p-4 text-center"><h1 class="h4">تأكيد حذف التصنيف</h1><p>هل أنت متأكد من حذف «{{ category.name }}»؟ ستبقى الجوالات موجودة دون تصنيف.</p><form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">نعم، احذف</button><a class="btn btn-outline-secondary ms-2" href="{% url 'category_list' %}">إلغاء</a></form></div></div></div></div>{% endblock %}
