{% extends "base.html" %}
{% block title %}تواصل معنا | PhoneStore{% endblock %}
{% block content %}
<section class="page-heading mb-4">
    <span class="eyebrow">نحن هنا لمساعدتك</span>
    <h1 class="display-6 fw-bold mt-2">تواصل معنا</h1>
    <p class="text-muted mb-0">أرسل استفسارك وسنعود إليك عبر البريد الإلكتروني.</p>
</section>
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card store-card border-0 p-4 p-lg-5">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label" for="name">الاسم</label><input class="form-control" id="name" name="name" required></div>
                    <div class="col-md-6"><label class="form-label" for="email">البريد الإلكتروني</label><input class="form-control" id="email" type="email" name="email" required></div>
                    <div class="col-12"><label class="form-label" for="subject">الموضوع</label><input class="form-control" id="subject" name="subject" required></div>
                    <div class="col-12"><label class="form-label" for="message">الرسالة</label><textarea class="form-control" id="message" name="message" rows="6" required></textarea></div>
                    <div class="col-12"><button class="btn btn-primary px-4" type="submit"><i class="bi bi-send me-1"></i> إرسال الرسالة</button></div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
