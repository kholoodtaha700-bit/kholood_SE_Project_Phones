<div class="d-flex flex-wrap gap-2 mb-3">
    <a class="btn btn-sm {% if not selected_category %}btn-primary{% else %}btn-outline-primary{% endif %}" href="{% url 'home' %}">الكل</a>
    {% for category in categories %}
        <a class="btn btn-sm {% if selected_category == category.pk|stringformat:'s' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="{% url 'home' %}?category={{ category.pk }}">{{ category.name }}</a>
    {% endfor %}
</div>
